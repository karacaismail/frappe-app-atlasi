name: Atlas QA
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Serve static atlas
        run: python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/atlas-server.log 2>&1 &
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlas-qa-evidence
          path: |
            /tmp/atlas-*.png
            /tmp/atlas-qa.json
